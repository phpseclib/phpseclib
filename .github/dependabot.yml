version: 2
updates:
    -   package-ecosystem: "github-actions"
        directory: "/"
        target-branch: "master"
        schedule:
            interval: "weekly"
        commit-message:
            prefix: "master"
        cooldown:
            default-days: 7
        groups:
            github-actions:
                patterns:
                    - "*"
    -   package-ecosystem: "github-actions"
        directory: "/"
        target-branch: "4.0"
        schedule:
