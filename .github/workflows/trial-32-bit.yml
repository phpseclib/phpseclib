# temporary: runs a branch's unit tests on 32-bit PHP with a candidate fix (trial/<branch>.patch) applied. delete the branch afterwards
name: Trial 32-bit
on: push

permissions:
    contents: read

jobs:
    tests:
        name: ${{ matrix.branch }} + fix / PHP ${{ matrix.php }} (32-bit)
        timeout-minutes: 30
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    ref: ${{ matrix.branch }}
            -   name: Checkout Trial Files
                uses: actions/checkout@v7
                with:
                    path: trial-branch
            -   name: Apply Fix
                run: |
                    git apply --verbose "trial-branch/trial/${{ matrix.patch }}"
                    rm -rf trial-branch
                    git status --short
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
            -   name: Composer Install
                run: |
                    # psalm requires php-64bit, which would make composer's platform check refuse to run on 32-bit PHP
                    composer remove --dev --no-update vimeo/psalm
                    composer require --dev --no-update "phpunit/phpunit:${{ matrix.phpunit }}" "brianium/paratest:${{ matrix.paratest }}"
                    composer update --with-all-dependencies --no-interaction
            -   name: 32-bit PHP
                run: docker run --rm --platform linux/386 php:${{ matrix.php }}-cli php -r 'echo PHP_VERSION, " ", PHP_INT_SIZE * 8, "-bit\n";'
            -   name: PHPUnit
                run: |
                    time docker run --rm --platform linux/386 --volume "$PWD:/app" --workdir /app php:${{ matrix.php }}-cli \
                        php -d memory_limit=-1 vendor/bin/phpunit --configuration tests/phpunit.xml
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   { branch: '4.0', patch: '4.0.patch', php: '8.1', phpunit: '^10.5', paratest: '^7.0' }
                    -   { branch: '4.0', patch: '4.0.patch', php: '8.5', phpunit: '^13.1', paratest: '^7.22' }
                    -   { branch: 'master', patch: '4.0.patch', php: '8.1', phpunit: '^10.5', paratest: '^7.0' }
                    -   { branch: 'master', patch: '4.0.patch', php: '8.5', phpunit: '^13.1', paratest: '^7.22' }
