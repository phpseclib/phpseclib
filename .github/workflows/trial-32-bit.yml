# temporary: runs each branch's unit tests on 32-bit PHP to see what fails and how long it takes. delete the branch afterwards
name: Trial 32-bit
on: push

permissions:
    contents: read

jobs:
    tests:
        name: ${{ matrix.branch }} / PHP ${{ matrix.php }} (32-bit)
        timeout-minutes: 15
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    ref: ${{ matrix.branch }}
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
            -   name: Composer Install
                run: |
                    case "${{ matrix.branch }}" in
                        4.0|master)
                            # psalm requires php-64bit, which would make composer's platform check refuse to run on 32-bit PHP
                            composer remove --dev --no-update vimeo/psalm
                            composer require --dev --no-update "phpunit/phpunit:${{ matrix.phpunit }}" "brianium/paratest:${{ matrix.paratest }}"
                            composer update --with-all-dependencies --no-interaction
                            ;;
                        3.0) composer install --classmap-authoritative --no-interaction ;;
                        *) composer install --no-interaction ;;
                    esac
            -   name: Make Tests Compatible
                run: |
                    atLeast() { php -r "exit(version_compare(PHP_VERSION, '$1', '>=') ? 0 : 1);"; }
                    case "${{ matrix.branch }}" in
                        1.0|2.0)
                            if atLeast 7.2; then php tests/make_compatible_with_phpunit9.php; fi
                            ;;
                        3.0)
                            if atLeast 7.1; then php tests/make_compatible_with_phpunit7.php; fi
                            if atLeast 7.3; then php tests/make_compatible_with_phpunit9.php; fi
                            if atLeast 8.1; then php tests/make_compatible_with_phpunit12.php; fi
                            ;;
                    esac
            -   name: 32-bit PHP
                run: docker run --rm --platform linux/386 php:${{ matrix.php }}-cli php -r 'echo PHP_VERSION, " ", PHP_INT_SIZE * 8, "-bit\n", implode(" ", get_loaded_extensions()), "\n";'
            -   name: PHPUnit
                run: |
                    if [ -f tests/phpunit.xml ]; then config='--configuration tests/phpunit.xml'; else config=''; fi
                    time docker run --rm --platform linux/386 --volume "$PWD:/app" --workdir /app php:${{ matrix.php }}-cli \
                        php -d memory_limit=-1 vendor/bin/phpunit $config --debug
        strategy:
            fail-fast: false
            matrix:
                # 2.0 only: its first run hung, and --debug names each test as it starts, so the last one named is the hang
                include:
                    -   { branch: '2.0', php: '5.6' }
                    -   { branch: '2.0', php: '8.5' }
