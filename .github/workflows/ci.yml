name: CI
on:
    # other branches are tested by pull_request; testing them on push as well would run every job twice
    push:
        branches: [master, '4.0', '3.0', '2.0', '1.0']
    pull_request:

permissions:
  contents: read #  to fetch code (actions/checkout)

# a newer push to the same branch or PR cancels the run for the older commit
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint
        timeout-minutes: 5
        # 8.6 is still a nightly build, so its jobs may fail without failing the run
        continue-on-error: ${{ matrix.php-version == '8.6' }}
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
                    tools: php-parallel-lint/php-parallel-lint:1
            -   name: Lint
                run: parallel-lint --show-deprecated build phpseclib tests
        strategy:
            fail-fast: false
            matrix:
                php-version: ['5.3', '5.4', '5.5', '5.6', '7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6']
    tests:
        name: Tests
        timeout-minutes: 15
        # 8.6 is still a nightly build, so its jobs may fail without failing the run
        continue-on-error: ${{ matrix.php-version == '8.6' }}
        runs-on: ${{ matrix.os }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
            -   name: Get Composer Cache Directory and Week
                id: composer-cache
                shell: bash
                run: |
                    echo "dir=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"
                    echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
            -   name: Cache Composer Packages
                # there's no composer.lock, so the key wouldn't change when new package versions come out. the week
                # makes it change, so the cache is saved again (starting from last week's) once a week
                uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: composer-${{ runner.os }}-${{ github.job }}-php${{ matrix.php-version }}-${{ hashFiles('composer.json') }}-${{ steps.composer-cache.outputs.week }}
                    restore-keys: composer-${{ runner.os }}-${{ github.job }}-php${{ matrix.php-version }}-
            -   name: Composer Install
                run: composer install --no-interaction
            -   name: Make Tests Compatiable With PHPUnit 9+
                if: contains(fromJSON('["7.2", "7.3", "7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5", "8.6"]'), matrix.php-version)
                run: php tests/make_compatible_with_phpunit9.php
            -   name: Setup Secure Shell Functional Tests
                if: matrix.os == 'ubuntu-latest'
                run: |
                    PHPSECLIB_SSH_USERNAME='phpseclib'
                    PHPSECLIB_SSH_PASSWORD='EePoov8po1aethu2kied1ne0'
                    
                    sudo useradd --create-home --base-dir /home "$PHPSECLIB_SSH_USERNAME"
                    echo "$PHPSECLIB_SSH_USERNAME:$PHPSECLIB_SSH_PASSWORD" | sudo chpasswd
                    ssh-keygen -t rsa -b 1024 -f "$HOME/.ssh/id_rsa" -q -N ""
                    eval `ssh-agent -s`
                    ssh-add "$HOME/.ssh/id_rsa"
                    sudo mkdir -p "/home/$PHPSECLIB_SSH_USERNAME/.ssh/"
                    sudo cp "$HOME/.ssh/id_rsa.pub" "/home/$PHPSECLIB_SSH_USERNAME/.ssh/authorized_keys"
                    sudo ssh-keyscan -t rsa localhost > "/tmp/known_hosts"
                    sudo cp "/tmp/known_hosts" "/home/$PHPSECLIB_SSH_USERNAME/.ssh/known_hosts"
                    sudo chown "$PHPSECLIB_SSH_USERNAME:$PHPSECLIB_SSH_USERNAME" "/home/$PHPSECLIB_SSH_USERNAME/.ssh/" -R
                    
                    # on some runners (the AWS-hosted ones) sshd refuses passwords, which fails every password
                    # login test. turn them on in a file that sorts first in sshd_config.d, since sshd keeps the
                    # first value it reads, and check that it took
                    echo 'PasswordAuthentication yes' | sudo tee /etc/ssh/sshd_config.d/00-phpseclib.conf
                    sudo sshd -t
                    sudo systemctl restart ssh
                    sudo sshd -T -C "user=$PHPSECLIB_SSH_USERNAME,host=localhost,addr=127.0.0.1" | grep -x 'passwordauthentication yes'
                    
                    echo "PHPSECLIB_SSH_HOSTNAME=localhost" >> $GITHUB_ENV
                    echo "PHPSECLIB_SSH_USERNAME=$PHPSECLIB_SSH_USERNAME" >> $GITHUB_ENV
                    echo "PHPSECLIB_SSH_PASSWORD=$PHPSECLIB_SSH_PASSWORD" >> $GITHUB_ENV
                    echo "PHPSECLIB_SSH_HOME=/home/phpseclib" >> $GITHUB_ENV
                    echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
            -   name: PHPUnit
                run: vendor/bin/phpunit
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                php-version: ['5.3', '5.4', '5.5', '5.6', '7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6']
                exclude:
                    # PHP 5.3 / 5.4 on windows don't have openssl or curl installed, which prevents composer from running
                    - os: windows-latest
                      php-version: '5.3'
                    - os: windows-latest
                      php-version: '5.4'
    compat:
        name: Compat Libraries
        timeout-minutes: 10
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    path: phpseclib
            -   name: Checkout ${{ matrix.library }}
                uses: actions/checkout@v7
                with:
                    repository: phpseclib/${{ matrix.library }}
                    ref: ${{ matrix.ref }}
                    path: compat
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
            -   name: Composer Install
                working-directory: compat
                # advisories are about releases, not this checkout, but Composer refuses any version one covers, and
                # some (eg. "< 3.0.57") cover every 2.0 version
                run: |
                    composer config repositories.phpseclib '{"type": "path", "url": "../phpseclib", "options": {"symlink": false, "versions": {"phpseclib/phpseclib": "2.0.x-dev"}}}'
                    composer config minimum-stability dev
                    composer config prefer-stable true
                    composer config audit.block-insecure false
                    composer update --no-interaction
            -   name: Make Tests Compatible With PHPUnit 9+
                if: hashFiles('compat/tests/make_compatible_with_phpunit9.php') != ''
                working-directory: compat
                run: php tests/make_compatible_with_phpunit9.php
            -   name: PHPUnit
                working-directory: compat
                run: vendor/bin/phpunit
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   { library: mcrypt_compat, ref: '1.0' }
                    -   { library: bcmath_compat, ref: '1.0' }
